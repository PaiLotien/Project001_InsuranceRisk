alert_escalation:
  yellow:
    roles:
    - branch_manager
    - hq_operations
    description: 黄色预警：通知分公司车险经理 + 总公司车险运营管理人员
    priority: 普通
    response_hours: 48
  orange:
    roles:
    - branch_manager
    - deputy_gm
    - hq_operations
    description: 橙色预警：通知分公司车险经理 + 分公司分管总 + 总公司车险运营管理人员
    priority: 紧急
    response_hours: 24
  red:
    roles:
    - branch_manager
    - deputy_gm
    - hq_operations
    - hq_director
    description: 红色预警：通知以上全部 + 总公司车险部部门长
    priority: 特急
    response_hours: 4
